<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>anu · your mood, your music</title>
<meta name="description" content="anu picks songs for your mood. songs in every Indian language, live lyrics, chat with a stranger and listen together.">
<meta name="theme-color" content="#F5EEFF">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Ccircle cx='24' cy='26' r='15' fill='%23A617FF'/%3E%3Cpath d='M10 26a14 14 0 0 1 28 0' stroke='%230B0B10' stroke-width='4' fill='none'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;800&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5EEFF;--card:#fff;--card2:#EBDCFF;--text:#0B0B10;--muted:#6b5c85;--violet:#A617FF;--deep:#5A12A0;--pink:#ff5fa8;--ink:#0B0B10;--lil:#F5EEFF}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:400 15px/1.4 Inter,system-ui,sans-serif}
svg{display:block}
button{font-family:inherit;color:inherit}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;overflow:hidden}
.screen{padding:18px 18px 190px;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:Poppins,sans-serif;font-weight:800;margin:0;letter-spacing:-.01em}
h1{font-size:30px;line-height:1.1}h2{font-size:22px}h3{font-size:18px;line-height:1.25}
.muted{color:var(--muted)}
.bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.mark{width:38px;height:38px}
.btn{background:var(--violet);color:#fff;border:0;border-radius:999px;padding:14px 28px;font:800 16px Poppins,sans-serif;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.link{background:none;border:0;color:var(--muted);font-size:13px;cursor:pointer;padding:8px 0}
/* landing */
.land{min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:24px 20px;position:relative}
.hero{position:relative;overflow:hidden;border-radius:30px;padding:30px 24px 96px;background:linear-gradient(160deg,var(--violet),var(--deep) 80%)}
.hero h1{font-size:40px;position:relative}
.burst{position:absolute;right:-60px;top:-60px;width:240px;opacity:.18;animation:spin 40s linear infinite}
.pill{display:inline-block;background:var(--lil);color:var(--deep);font:800 14px Poppins,sans-serif;padding:9px 16px;border-radius:999px;transform:rotate(-4deg);margin-top:18px;position:relative}
.done{position:absolute;left:16px;right:16px;bottom:16px;background:#fff;color:var(--ink);border-radius:16px;padding:14px 16px;display:flex;gap:10px;align-items:center;font:600 15px Poppins,sans-serif;transform:rotate(1.5deg);animation:bob 4s ease-in-out infinite}
.done i{width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;flex:none}
.done i svg{width:13px;height:13px}
.d{position:absolute;width:30px;height:30px;color:var(--lil);animation:float 6s ease-in-out infinite;opacity:.9}
.d svg{width:100%;height:100%}
.d1{right:24px;top:130px}.d2{left:50%;top:18px;animation-delay:-2s}.d3{right:20px;bottom:100px;animation-delay:-4s;width:26px}
@keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-10px) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bob{0%,100%{transform:rotate(1.5deg) translateY(0)}50%{transform:rotate(-.5deg) translateY(-5px)}}
@keyframes wig{0%,88%,100%{transform:rotate(0)}91%{transform:rotate(-10deg)}95%{transform:rotate(8deg)}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
.mark svg,.land .mark{animation:wig 3.5s ease-in-out infinite}
.land .mark{width:64px;height:64px}
input{width:100%;padding:15px 16px;border:2px solid var(--card2);border-radius:14px;background:var(--card);color:var(--text);font:600 16px Poppins,sans-serif;outline:none}
input:focus{border-color:var(--violet)}
/* home */
.pop{background:var(--card);border-radius:22px;padding:18px;margin-top:14px;animation:up .45s both}
.pop:nth-child(2){animation-delay:.12s}.pop:nth-child(3){animation-delay:.24s}
.pop.out{opacity:0;transform:scale(.92);transition:.25s}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.who{display:flex;align-items:center;gap:6px;font:800 11px Poppins,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--violet);margin-bottom:6px}
.who svg{width:15px;height:15px}
.yn{display:flex;gap:10px;margin-top:14px}
.yn button{flex:1;border-radius:999px;padding:11px;font:800 14px Poppins,sans-serif;cursor:pointer;border:2px solid var(--muted);background:none}
.yn .yes{background:var(--violet);border-color:var(--violet);color:#fff}
.sec{margin:26px 0 10px;display:flex;align-items:center;justify-content:space-between}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -18px;padding-left:18px;padding-right:18px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:var(--card2);border-radius:999px;padding:8px 14px;font:600 13px Poppins,sans-serif;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--text)}
.chip svg{width:17px;height:17px}
.chip.on{background:var(--violet);color:#fff}
/* rows */
.list{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:12px;cursor:pointer}
.row:active,.row.now{background:var(--card2)}
.art{width:50px;height:50px;border-radius:8px;flex:none;background:linear-gradient(145deg,var(--violet),var(--deep));object-fit:cover;display:grid;place-items:center;font:800 20px Poppins,sans-serif}
.meta{flex:1;min-width:0}
.meta b{display:block;font:600 15px Inter,sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.now .meta b{color:#A617FF}
.meta span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.ib{background:none;border:0;padding:8px;cursor:pointer;color:var(--muted);flex:none}
.ib svg{width:22px;height:22px}
.ib.on{color:var(--pink)}.ib.on svg{animation:pop .4s}
.msg{color:var(--muted);text-align:center;padding:28px 10px}
/* player + nav */
#player{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;max-width:480px;margin:0 auto;padding:0 8px}
.mini{background:linear-gradient(90deg,#2b1745,#1d1230);border-radius:14px;padding:8px 8px 10px;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mini .top{display:flex;align-items:center;gap:10px}
.mini .art{width:42px;height:42px}
.pbtn{background:var(--text);color:var(--bg);border:0;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;cursor:pointer;flex:none}
.pbtn svg{width:18px;height:18px}
.prog{height:3px;background:rgba(255,255,255,.2);border-radius:3px;margin-top:8px;overflow:hidden}
.prog div{height:100%;width:0;background:var(--text)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:7;max-width:480px;margin:0 auto;display:flex;background:#0f0a16;border-top:1px solid #241833;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer}
nav button svg{width:22px;height:22px}
nav button.on{color:#fff}nav button.on svg{color:var(--violet)}
.empty-ic{width:64px;height:64px;color:var(--violet);margin:0 auto 14px}
/* playful sticker UI: soft, no borders */
.pop,.mv,.step{box-shadow:0 8px 24px rgba(90,18,160,.12)}
.mv{transition:transform .2s,background .2s}.mv:active{transform:scale(.96)}
.mv.on{background:var(--violet);color:#fff}.mv.on span{color:#efe0ff}
.yn button{border:0;background:var(--card2);color:var(--ink);transition:transform .12s}
.yn .yes{background:var(--violet);color:#fff}
.yn button:active,.btn:active{transform:scale(.95)}
.btn{box-shadow:0 10px 24px rgba(166,23,255,.35);transition:transform .12s}
input{border:0;box-shadow:0 6px 18px rgba(90,18,160,.1)}
input:focus{box-shadow:0 0 0 3px var(--violet)}
.chip{transition:transform .15s,background .15s}.chip:active{transform:scale(.93)}
.chip.on{box-shadow:0 6px 14px rgba(166,23,255,.35)}
.sticker{display:inline-flex;align-items:center;gap:7px;font:600 12px Poppins,sans-serif;letter-spacing:.02em;padding:6px 12px;border-radius:999px;background:var(--card2);color:var(--deep);margin:12px 0 0}
.sticker::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--violet);animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
.sticker.v,.sticker.p{background:var(--card2);color:var(--deep)}
@keyframes wob{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(2deg) scale(1.04)}}
.sub{color:var(--muted);margin:10px 0 0;font-size:15px}
.callout{background:linear-gradient(135deg,var(--violet),var(--deep));color:#fff;border-radius:22px;padding:16px;margin-top:16px;box-shadow:0 12px 28px rgba(90,18,160,.3);animation:up .5s both}
.callout b{font:800 15px Poppins,sans-serif}
.meter{height:10px;background:rgba(255,255,255,.28);border-radius:99px;margin-top:10px;overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .6s}
.steps{display:flex;flex-direction:column;gap:12px;margin:22px 0}
.step{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:18px;padding:14px;animation:up .5s both}
.step:nth-child(2){animation-delay:.12s}.step:nth-child(3){animation-delay:.24s}
.step i{width:34px;height:34px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font:800 16px Poppins,sans-serif;font-style:normal;flex:none}
.toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:20;background:#fff;color:var(--ink);border-radius:999px;padding:6px 18px 6px 6px;display:flex;align-items:center;gap:10px;font:600 14px Poppins,sans-serif;box-shadow:0 10px 28px rgba(90,18,160,.28);animation:drop .35s both;white-space:nowrap;max-width:92vw}
.toast.out{opacity:0;transition:.3s}
.sb{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.sb svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 8s linear infinite}
.sb b{position:relative;font:800 11px Poppins,sans-serif;color:#fff;transform:rotate(-8deg)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-30px) scale(.8)}to{opacity:1;transform:translate(-50%,0)}}
.fly{position:fixed;z-index:30;width:20px;height:20px;color:var(--pink);pointer-events:none;animation:fly .8s ease-out forwards}
@keyframes fly{to{opacity:0;transform:translate(var(--x),var(--y)) scale(.4) rotate(40deg)}}
.row{animation:slide .4s both;animation-delay:calc(var(--n,0)*45ms)}
@keyframes slide{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
nav{background:#fff;border:0;box-shadow:0 -8px 24px rgba(90,18,160,.1)}
nav button.on{color:var(--ink)}nav button.on svg{animation:pop .4s}
.mini{color:var(--lil);box-shadow:0 10px 28px rgba(11,11,16,.35)}.mini .meta span{color:#bda9dc}
.pbtn{background:var(--lil);color:var(--ink)}.pbtn.ghost{background:none;color:var(--lil)}
.prog div{background:var(--lil)}
.lyb{border:0;background:var(--violet);color:#fff;border-radius:999px;padding:7px 12px;font:800 12px Poppins,sans-serif;cursor:pointer;flex:none}
.eq{display:flex;gap:2px;align-items:flex-end;height:16px;flex:none}
.eq i{width:3px;background:var(--violet);border-radius:2px;animation:eq .8s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.3s}.eq i:nth-child(3){animation-delay:-.6s}
@keyframes eq{0%,100%{height:4px}50%{height:16px}}
#now .nowp{position:fixed;inset:0;max-width:480px;margin:0 auto;z-index:15;background:var(--bg);display:flex;flex-direction:column;padding:14px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:rise .35s both}
@keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.nhead{display:flex;align-items:center;justify-content:space-between}
.nhead .ib,.ctrl .ib{color:var(--ink)}.ctrl .ib.on{color:var(--pink)}
.nart{display:flex;align-items:center;gap:14px;margin-top:8px}
.nart .meta{min-width:0}
.nart img,.nart .art{width:84px;height:84px;border-radius:18px;box-shadow:0 12px 28px rgba(90,18,160,.3)}
.lyr{position:relative;flex:1;overflow-y:auto;margin:10px -4px 8px;padding:40% 4px;scrollbar-width:none}
.lyr::-webkit-scrollbar{display:none}
.ln{font:800 24px/1.25 Poppins,sans-serif;color:#bba5d8;padding:7px 0;cursor:pointer;transition:all .35s;transform-origin:left center}
.ln.past{color:#a38bc8}.ln.on{color:var(--violet);transform:scale(1.07)}
.lyr.plain .ln{font-size:17px;color:var(--ink);cursor:default;font-weight:600}
.ctrl{display:flex;align-items:center;justify-content:center;gap:16px;margin-top:10px}
.ctrl .pbtn{background:var(--violet);color:#fff;width:60px;height:60px;box-shadow:0 10px 22px rgba(166,23,255,.4)}.ctrl .pbtn svg{width:24px;height:24px}
#now .prog{background:rgba(90,18,160,.18)}#now .prog div{background:var(--violet)}
#pops{position:fixed;left:0;right:0;max-width:480px;margin:0 auto;padding:0 12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:12;display:flex;flex-direction:column;gap:10px;align-items:flex-end;pointer-events:none}
body.hasplayer #pops{bottom:calc(152px + env(safe-area-inset-bottom,0px))}
.npop{pointer-events:auto;width:min(290px,100%);background:#fff;border-radius:20px;padding:14px;box-shadow:0 14px 36px rgba(90,18,160,.3);animation:pin .55s cubic-bezier(.2,1.3,.4,1) both}
.npop.out{animation:pout .3s both}
@keyframes pin{from{opacity:0;transform:translateX(70px) scale(.9)}to{opacity:1;transform:none}}
@keyframes pout{to{opacity:0;transform:translateX(70px) scale(.9)}}
.npop .hd{display:flex;align-items:center;gap:8px;font:800 11px Poppins,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--violet)}
.npop .hd svg{width:24px;height:24px;animation:none}
.npop p{margin:6px 0 0;font:600 16px/1.3 Poppins,sans-serif}
.npop .yn{margin-top:12px}
.mbanner{display:flex;align-items:center;gap:12px;width:100%;margin-top:14px;background:#fff;border:0;border-radius:18px;padding:12px 14px;text-align:left;cursor:pointer;box-shadow:0 8px 22px rgba(90,18,160,.12);font:600 15px/1.3 Poppins,sans-serif;color:var(--ink);animation:up .5s both}
.mbanner .sb{width:46px;height:46px}.mbanner .hh svg{width:18px;height:18px;color:#fff}.mbanner .hh{position:relative;display:grid}
.dots{display:flex;gap:6px;margin-bottom:10px}.dots i{flex:1;height:6px;border-radius:9px;background:var(--card2)}.dots i.done{background:var(--violet)}.dots i.cur{background:var(--deep);animation:blink 1.2s infinite}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.opt{border:0;background:#fff;border-radius:16px;padding:16px;font:600 16px Poppins,sans-serif;text-align:left;cursor:pointer;color:var(--ink);box-shadow:0 6px 18px rgba(90,18,160,.1);transition:transform .15s,background .15s;animation:up .4s both}
.opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}.opt:nth-child(5){animation-delay:.24s}
.opt:active{transform:scale(.97)}.opt.hit{background:var(--violet);color:#fff}.opt.miss{background:var(--card2);color:var(--muted)}
.matchsb{position:relative;width:210px;height:210px;margin:0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center}
.matchsb svg{position:absolute;inset:0;width:100%;height:100%;animation:spin 14s linear infinite}
.matchsb b{position:relative;font:800 50px Poppins,sans-serif;color:#fff;line-height:1}
.matchsb small{position:relative;font:800 12px Poppins,sans-serif;letter-spacing:.15em;text-transform:uppercase;color:#f1dcff;margin-top:4px}
#ytwrap{display:none;position:fixed;z-index:16;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 12px 30px rgba(11,11,16,.4)}
#ytwrap iframe{width:100%;height:100%;border:0;display:block}
#ytwrap.now{display:block;top:calc(66px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(360px,calc(100vw - 36px));height:202px}
#ytwrap.tile{display:block;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:200px;height:202px}
/* chat and now playing */
.nart img,.nart .art{width:96px;height:96px;border-radius:24px;box-shadow:0 16px 36px rgba(90,18,160,.22)}
.lyr{-webkit-mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 18%,#000 82%,transparent 100%)}
.ln{font:700 23px/1.3 Poppins,sans-serif;color:#cdbbe8;letter-spacing:-.01em}
.ln.past{color:#c0aae0}
#now .prog{height:4px}
.screen.chat{padding-bottom:230px}
.chead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.av{width:42px;height:42px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center;font:800 18px Poppins,sans-serif;flex:none}
.chead .ib{background:#fff;border-radius:50%;box-shadow:0 4px 12px rgba(90,18,160,.1);color:var(--ink)}
.tog{background:var(--card2);color:var(--deep);border-radius:12px;padding:8px 12px;font:600 13px Poppins,sans-serif;display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.msgs{display:flex;flex-direction:column;gap:8px;min-height:40vh}
.bub{max-width:80%;padding:10px 14px;border-radius:18px;font-size:15px;line-height:1.35;word-wrap:break-word;animation:up .25s both}
.bub.me{align-self:flex-end;background:var(--violet);color:#fff;border-bottom-right-radius:6px}
.bub.them{align-self:flex-start;background:#fff;box-shadow:0 4px 12px rgba(90,18,160,.08);border-bottom-left-radius:6px}
.chatbar{position:fixed;left:0;right:0;max-width:480px;margin:0 auto;bottom:calc(64px + env(safe-area-inset-bottom,0px));padding:10px 12px;background:var(--bg);display:flex;gap:8px;z-index:5}
body.hasplayer .chatbar{bottom:calc(140px + env(safe-area-inset-bottom,0px))}
.chatbar input{flex:1}
.send{width:48px;height:48px;border-radius:50%;border:0;background:var(--violet);color:#fff;display:grid;place-items:center;cursor:pointer;flex:none}.send svg{width:22px;height:22px}
body.inchat #pops{display:none}
.radar{position:relative;width:150px;height:150px;margin:0 auto 24px;display:grid;place-items:center}
.radar i{position:absolute;inset:0;border-radius:50%;border:2px solid var(--violet);opacity:0;animation:ping 2.4s ease-out infinite}.radar i:nth-child(2){animation-delay:.8s}.radar i:nth-child(3){animation-delay:1.6s}
.radar span{width:64px;height:64px;border-radius:50%;background:var(--violet);color:#fff;display:grid;place-items:center}.radar svg{width:30px;height:30px}
@keyframes ping{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.2);opacity:0}}
.rule{display:flex;align-items:center;gap:10px;margin:18px 0 4px;font-size:14px;cursor:pointer}
.rule input{width:20px;height:20px;padding:0;box-shadow:none;accent-color:#A617FF}
.sheet2{position:fixed;inset:0;background:rgba(11,11,16,.45);z-index:18;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheetbox{background:var(--bg);width:100%;max-width:480px;border-radius:26px 26px 0 0;padding:20px 16px 16px;max-height:80vh;overflow:auto;animation:rise .3s both}
/* pro home + player */
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.qt{display:flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:14px;padding:0 10px 0 0;height:56px;overflow:hidden;font:700 14px Poppins,sans-serif;color:var(--ink);text-align:left;cursor:pointer;box-shadow:0 6px 16px rgba(90,18,160,.1);transition:transform .12s}
.qt:active{transform:scale(.96)}
.qt i{width:56px;height:56px;display:grid;place-items:center;color:#fff;flex:none}
.qt svg{width:26px;height:26px}
.shelf{display:flex;gap:12px;overflow-x:auto;margin:0 -18px;padding:0 18px 6px;scrollbar-width:none}
.shelf::-webkit-scrollbar{display:none}

function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}

else{var langs=lang==="All"?shuf(Object.keys(POOL)).slice(0,4):[lang];

var bad=0;
return Promise.all(terms.map(function(t){return songsFor(t,12).catch(function(){bad++;return[]})})).then(function(g){

var seen={},out=[],i=0,more=true;

var apiOK=location.protocol!=="file:",resSeq=0;
function firstArtist(a){return a.split(/,|&/)[0].trim()}
function resolveTrack(t){if(t.yt||t.tried||!apiOK)return Promise.resolve(t);
var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},9000);
return fetch("/api/song?title="+encodeURIComponent(cleanT(t.title))+"&artist="+encodeURIComponent(firstArtist(t.artist)),{signal:ctl.signal})
.then(function(r){clearTimeout(to);if(r.status===501||r.status===404){apiOK=false;console.warn(r.status===501?"anu: /api/song says YT_API_KEY is not set on the server.":"anu: /api/song not found. Deploy to Vercel or run vercel dev.");return null}return r.ok?r.json():null})
.then(function(d){if(d&&d.found)return Object.assign({},t,{yt:d.yt,lrcText:d.lrc||"",tried:1});t.tried=1;return t})
.catch(function(){clearTimeout(to);return t})}
function playList(list,i){var t=list[i];queue=list;qi=i;
if(t.yt||t.tried||!apiOK)return playNow(list,i);
var seq=++resSeq;toast("HOLD ON","finding the full song…");
resolveTrack(t).then(function(u){if(seq!==resSeq)return;list[i]=u;playNow(list,i)})}
function loadLyrics(tr){var key=tr.id;lyr={lines:[],off:0,key:key,status:"loading",k:-2};
if(tr.lrcText){lyr.lines=parseLRC(tr.lrcText);lyr.status=lyr.lines.length?"ok":"none";drawNow();return}
drawNow();
fetch("https://lrclib.net/api/search?track_name="+encodeURIComponent(cleanT(tr.title))+"&artist_name="+encodeURIComponent(firstArtist(tr.artist)))
.then(function(r){return r.json()}).then(function(a){if(lyr.key!==key)return;a=a||[];
if(tr.yt){var h=a.filter(function(x){return x.syncedLyrics})[0];
if(h){lyr.lines=parseLRC(h.syncedLyrics);lyr.status=lyr.lines.length?"ok":"none"}else lyr.status="none"}
else{var p=a.filter(function(x){return x.plainLyrics||x.syncedLyrics})[0];
if(p){lyr.plain=(p.plainLyrics||p.syncedLyrics.replace(/\[[^\]]*\]/g,"")).split("\n").map(function(z){return z.trim()}).filter(Boolean);lyr.status=lyr.plain.length?"plain":"none"}else lyr.status="none"}
drawNow()}).catch(function(){if(lyr.key===key){lyr.status="err";drawNow()}})}

return '<div class="screen"><h1>talk to a stranger</h1><div class="sticker">random person, random vibe</div><p class="sub">chat with someone new and listen to the same song at the same time. you stay anonymous, only your nickname shows.</p><p class="sub">be kind. never share personal info. block or report anyone who isn’t kind.</p><label class="rule"><input type="checkbox" data-adult '+(CH.adult?'checked':'')+'> i’m 18 or older</label><button class="btn full" data-find '+(CH.adult?'':'disabled')+'>Find someone</button></div>'}
document.addEventListener("click",function(e){var t=e.target,m;
if(t.hasAttribute&&t.hasAttribute("data-sheetbg"))return closeSheet();
if(m=t.closest("[data-adult]")){CH.adult=m.checked;save("anu_adult",CH.adult);var b=document.querySelector("[data-find]");if(b)b.disabled=!CH.adult;return}
if(t.closest("[data-find]"))return CH.adult&&findStranger();
if(t.closest("[data-again2]"))return findStranger();
if(t.closest("[data-done2]")){CH.state="idle";drawScreen();drawNav();return}
if(t.closest("[data-cancel]"))return cancelSearch();
if(t.closest("[data-end]"))return endChat();
if(t.closest("[data-block]"))return blockPeer();
if(t.closest("[data-report]"))return reportPeer();
if(t.closest("[data-listen]"))return openSheet();
if(t.closest("[data-sheetx]"))return closeSheet();
if(m=t.closest("[data-share]"))return shareSong(CH.pickList[+m.dataset.share]);
if(t.closest("[data-send]"))return sendMsg();
if(t.closest("[data-sync]")){sendCtl("play");toast("SYNCED","both players lined up");return}
});
document.addEventListener("keydown",function(e){if(e.key!=="Enter")return;if(e.target.id==="cm")sendMsg();if(e.target.id==="sq")pickSearch(e.target.value)});

var QG=["#A617FF,#5A12A0","#7a14d6,#3b0a73","#c25bff,#7a14d6","#5A12A0,#2a0a52","#8f35ff,#5A12A0"],SH={recent:[],fav:[]};
function go(t){ui.tab=t;drawScreen();drawNav();if(t==="songs"&&ui.fresh&&!ui.loading&&!ui.list.length)search()}
function greet(){var h=new Date().getHours();return h<5?"still up":h<12?"good morning":h<17?"good afternoon":"good evening"}
function skel(){var a="";for(var i=0;i<6;i++)a+='<div class="row sk"><div class="art shimmer"></div><div class="meta"><div class="shl" style="width:60%"></div><div class="shl" style="width:35%"></div></div></div>';return '<div class="list">'+a+'</div>'}
function shelf(list,attr,title){return list.length?'<div class="sec"><h2>'+title+'</h2></div><div class="shelf">'+list.map(function(t,i){return '<div class="sc" '+attr+'="'+i+'">'+artHTML(t)+'<b>'+esc(t.title)+'</b><span>'+esc(t.artist)+'</span></div>'}).join("")+'</div>':''}
function shelves(){SH.recent=hist.slice(0,10);SH.fav=likes.slice(0,10);return shelf(SH.recent,"data-rp","recently played")+shelf(SH.fav,"data-fp","your favorites")||'<p class="msg">play something and it shows up here.</p>'}
function refreshHome(){if(ui.tab!=="home")return;var a=document.getElementById("shelves"),c=document.getElementById("cbox");if(a)a.innerHTML=shelves();if(c)c.innerHTML=callout()}
function home(){var mp=load("anu_match",null);
return '<div class="screen"><div class="bar">'+mark("mark")+'</div><h1>'+greet()+',<br><span style="color:#A617FF">'+esc(user.name)+'</span></h1>'+
'<div class="qgrid">'+MOODS.map(function(m,i){return '<button class="qt" data-qm="'+m+'"><i style="background:linear-gradient(135deg,'+QG[i%5]+')">'+face(m)+'</i>'+m+'</button>'}).join("")+'<button class="qt" data-qm="surprise"><i style="background:linear-gradient(135deg,#ff5fa8,#A617FF)">'+IC.star+'</i>surprise me</button></div>'+
'<div id="shelves">'+shelves()+'</div>'+
'<button class="mbanner" data-game><span class="sb">'+sbSvg(10,98,72,"#A617FF")+'<b class="hh">'+IC.heartF+'</b></span><span>'+(mp!==null?'you and anu: '+mp+'% match. play again?':'anu wants to know: is there any match between you and anu?')+'</span></button><div id="cbox">'+callout()+'</div>'+
'<button class="link" data-signout style="margin-top:24px">sign out</button></div>'}
function landing(){clearPops();nav.innerHTML="";pl.innerHTML="";
main.innerHTML='<div class="land">'+mark("mark")+'<div class="hero"><svg class="burst" viewBox="0 0 200 200">'+burstPts()+'</svg><span class="d d1">'+IC.star+'</span><span class="d d2">'+IC.squig+'</span><span class="d d3">'+IC.music+'</span><h1>feel it.<br>pick it.<br>play it.</h1><p style="position:relative;margin:12px 0 0;font-weight:500">your mood picks the music. anu does the rest.</p><div class="pill">lets be dumb.</div><div class="done"><i>'+IC.check+'</i><s>overthinking everything</s></div></div>'+
(user?'<p class="sub" style="text-align:center;margin:0">welcome back, <b>'+esc(user.name)+'</b></p><button class="btn full" id="go" style="margin-top:8px">Continue</button><button class="link" id="notme" style="width:100%;text-align:center">not you? start fresh</button>':'<button class="btn full" id="go">Get started</button>')+'</div>';
document.getElementById("go").onclick=function(){user?startFlow():nameScreen()};
var nm=document.getElementById("notme");if(nm)nm.onclick=function(){resetAll()}}
function resetAll(){["anu_user","anu_hist2","anu_likes2","anu_pts","anu_match","anu_qseen","anu_block","anu_adult"].forEach(function(k){try{localStorage.removeItem(k)}catch(e){}});
user=null;hist=[];likes=[];pts=0;CH.blocked=[];CH.adult=false;try{audio.pause()}catch(e){}try{if(YTP&&YTP.stopVideo)YTP.stopVideo()}catch(e){}
cur=null;queue=[];ui.nowOpen=false;setWrap();document.getElementById("now").innerHTML="";ui.mood=null;ui.lang="All";ui.q="";ui.list=[];ui.fresh=true;document.body.classList.remove("hasplayer","inchat");landing()}
function fmt(x){x=Math.max(0,Math.floor(x||0));return Math.floor(x/60)+":"+("0"+(x%60)).slice(-2)}
setInterval(function(){var a=document.getElementById("tc"),b=document.getElementById("td");if(a&&b&&cur){a.textContent=fmt(curTime());b.textContent=fmt(curDur())}},500);
function setMedia(){if(!("mediaSession" in navigator)||!cur)return;try{
navigator.mediaSession.metadata=new MediaMetadata({title:cur.title,artist:cur.artist,artwork:cur.art?[{src:cur.art,sizes:"300x300"}]:[]});
navigator.mediaSession.setActionHandler("play",function(){if(isPaused())toggle()});
navigator.mediaSession.setActionHandler("pause",function(){if(!isPaused())toggle()});
navigator.mediaSession.setActionHandler("nexttrack",function(){step(1)});
navigator.mediaSession.setActionHandler("previoustrack",function(){step(-1)})}catch(e){}}
document.addEventListener("click",function(e){var t=e.target,m;
if(m=t.closest("[data-qm]")){var q=m.dataset.qm;if(q==="surprise"){q=MOODS[Math.floor(Math.random()*MOODS.length)];ui.lang=LANGS[1+Math.floor(Math.random()*(LANGS.length-1))]}else ui.lang="All";ui.mood=q;ui.q="";ui.fresh=false;ui.tab="songs";drawNav();return search()}
if(m=t.closest("[data-rp]"))return playList(SH.recent,+m.dataset.rp);
if(m=t.closest("[data-fp]"))return playList(SH.fav,+m.dataset.fp);
if(m=t.closest("[data-seek]")){var r=m.getBoundingClientRect(),d=curDur();if(d&&r.width){seekLocal((e.clientX-r.left)/r.width*d);if(CH.together&&!CH.remote)sendCtl("play")}return}
if(t.closest("[data-signout]")){if(confirm("sign out? this clears your favorites and history on this device."))resetAll()}});
document.addEventListener("keydown",function(e){if(e.code!=="Space"||!cur)return;var n=(e.target.tagName||"").toLowerCase();if(n==="input"||n==="textarea"||n==="button")return;e.preventDefault();toggle()});
landing();
